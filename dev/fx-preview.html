<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>法术演出预览 · 山海策</title>
<style>
  :root {
    --ink: #12160f;
    --panel: #1b2019;
    --line: #2f372c;
    --gold: #c9b184;
    --paper: #dfe6d7;
    --dim: #8d9788;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, #1d231b 0%, var(--ink) 70%);
    color: var(--paper);
    font: 14px/1.7 "Songti SC", "Noto Serif SC", serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 40px;
  }
  h1 { font-size: 17px; letter-spacing: .22em; color: var(--gold); font-weight: 400; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--dim); letter-spacing: .1em; margin-bottom: 20px; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; }
  canvas { border-radius: 4px; display: block; background: #171c15; }
  .stage { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--panel); }
  .list { width: 232px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 10px 8px; max-height: 470px; overflow-y: auto; }
  .grp { font-size: 11px; letter-spacing: .2em; color: var(--dim); margin: 10px 4px 6px; }
  .grp:first-child { margin-top: 0; }
  .sp {
    display: flex; align-items: baseline; gap: 6px; width: 100%;
    background: none; border: 1px solid transparent; border-radius: 4px;
    color: var(--paper); font: inherit; font-size: 13px;
    padding: 5px 7px; cursor: pointer; text-align: left;
  }
  .sp:hover { border-color: var(--line); background: #222a20; }
  .sp.on { border-color: var(--gold); background: #262d22; }
  .sp b { font-weight: 400; }
  .rk { font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--dim); }
  .bar label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .bar button {
    background: #222a20; color: var(--gold); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .bar button:hover { border-color: var(--gold); }
  .hint { margin-top: 14px; font-size: 12px; color: var(--dim); max-width: 940px; line-height: 1.9; }
  .hint code { color: var(--gold); }
</style>
</head>
<body>
<h1>法 术 演 出 预 览</h1>
<div class="sub">五行形态 × 三阶强度 · 不进战斗直接看</div>

<div class="wrap">
  <div class="stage">
    <canvas id="cv" width="672" height="448"></canvas>
    <div class="bar">
      <button id="again">再演一次</button>
      <label><input type="checkbox" id="juice" checked> 打击感</label>
      <label><input type="checkbox" id="reduced"> 减少动效</label>
      <span id="stat"></span>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="hint">
  点左边任一法术即演一次：<b>法阵起手 → 弹道 → 命中</b>。A 阶（万刃归宗、焚天、地裂）会多一段立绘切入与推镜。<br>
  这条页只载入 <code>juice.js</code> + <code>spell-fx.js</code>，不载入战斗，所以演得和实战一致，但不会扣法术次数。
</div>

<script src="../js/data-core.js"></script>
<script src="../js/data-systems.js"></script>
<script>
  /* 预览页的最小宿主：Juice 只认这几个全局 */
  const Game = { settings: { juice: true, reducedMotion: false } };
  const Render = { ox: 0, oy: 0, tile: 56, riseAt: () => 0 };
</script>
<script src="../js/juice.js"></script>
<script src="../js/systems/spell-fx.js"></script>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const geo = { ox: 0, oy: 0, tile: 56, W: 12, H: 8, boardW: 672, boardH: 448 };

  const caster = { x: 1, y: 4, name: '施法者', side: 'player' };
  const target = { x: 9, y: 3, name: '受术者', side: 'enemy' };

  let busy = false;
  let cur = null;

  /* ---------------- 画格 ---------------- */
  const TINT = { metal: '#d8c690', wood: '#8fbf7a', water: '#7ab0c9', fire: '#c97b5a', earth: '#b09a6a', none: '#e6cf8e' };

  function drawBoard() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const g = ctx.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, '#1a2018');
    g.addColorStop(1, '#141911');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cv.width, cv.height);

    ctx.strokeStyle = 'rgba(201,177,132,.10)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= geo.W; x++) {
      ctx.beginPath(); ctx.moveTo(x * geo.tile + .5, 0); ctx.lineTo(x * geo.tile + .5, cv.height); ctx.stroke();
    }
    for (let y = 0; y <= geo.H; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * geo.tile + .5); ctx.lineTo(cv.width, y * geo.tile + .5); ctx.stroke();
    }

    /* 施法者 / 受术者：细菱形标记，别用圆——圆会和法阵环混成一团 */
    const dot = (u, color, label) => {
      const px = u.x * geo.tile + geo.tile / 2;
      const py = u.y * geo.tile + geo.tile / 2;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1.2;
      ctx.strokeRect(-9, -9, 18, 18);
      ctx.restore();
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.7;
      ctx.font = '12px "Songti SC", serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, px, py + 38);
    };
    dot(caster, '#9fb7c9', '施法者');
    dot(target, '#c98d7a', '受术者');

    /* 立绘切入（A 阶）：预览页没有战场立绘，用一道金条代替，
       至少能看出「静→蓄」这一段的存在与节奏 */
    if (Juice.cutIn) {
      const c = Juice.cutIn;
      const t = Math.min(1, Math.max(0, (Juice.clock - c.t0) / c.dur));
      const inP = c.out ? (1 - t) : Math.min(1, t * 3.2);
      const w = cv.width * 0.30;
      const x = c.side === 'L' ? -w + w * inP : cv.width - w * inP;
      ctx.save();
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, 'rgba(201,177,132,0)');
      g.addColorStop(0.4, 'rgba(201,177,132,.5)');
      g.addColorStop(1, 'rgba(201,177,132,.14)');
      ctx.fillStyle = g;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(x, cv.height * 0.26, w, cv.height * 0.48);
      ctx.strokeStyle = 'rgba(233,214,170,.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, cv.height * 0.26);
      ctx.lineTo(x, cv.height * 0.74);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------------- 主循环 ----------------
   * 用定时器而不是 requestAnimationFrame：无头浏览器里 rAF 只在合成帧
   * 触发，virtual-time 推不动它，截图会截到「刚起步」的一帧。
   * 定时器走的是同一个 virtual clock，能截到确定时刻。 */
  let last = performance.now();
  function frame() {
    const now = performance.now();
    const dt = now - last;
    last = now;
    Juice.update(dt);
    drawBoard();
    Juice.drawFx(ctx, geo);
    setTimeout(frame, 16);
  }

  /* ---------------- 演出 ---------------- */
  const host = {
    B: { speed: 1 },
    sfx() {},
    wait: (ms) => new Promise(r => setTimeout(r, ms)),
    log() {}, float() {}
  };

  async function play(sp) {
    if (busy) return;
    busy = true;
    document.getElementById('stat').textContent = '演：' + sp.name + '（' + sp.rank + ' 阶）';
    Juice.clearAll();
    await SpellFx.play(host, caster, target, sp);
    await host.wait(40);
    SpellFx.impact(host, target, sp);
    await host.wait(700);
    busy = false;
  }

  /* ---------------- 法术列表 ---------------- */
  const ORDER = ['metal', 'wood', 'water', 'fire', 'earth', 'none'];
  const NAME = { metal: '金', wood: '木', water: '水', fire: '火', earth: '土', none: '歌' };
  const list = document.getElementById('list');
  let buttons = [];

  ORDER.forEach(el => {
    const items = Object.keys(SPELLS).map(k => SPELLS[k]).filter(s => (s.element || 'none') === el);
    if (!items.length) return;
    const g = document.createElement('div');
    g.className = 'grp';
    g.textContent = NAME[el] + ' · ' + items.length + ' 条';
    list.appendChild(g);
    items.forEach(sp => {
      const b = document.createElement('button');
      b.className = 'sp';
      b.dataset.key = sp.key;
      b.innerHTML = '<b>' + sp.name + '</b><span class="rk">' + sp.rank + '</span>';
      b.onclick = () => {
        buttons.forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        cur = sp;
        play(sp);
      };
      buttons.push(b);
      list.appendChild(b);
    });
  });

  document.getElementById('again').onclick = () => { if (cur) play(cur); };
  document.getElementById('juice').onchange = e => { Game.settings.juice = e.target.checked; };
  document.getElementById('reduced').onchange = e => { Game.settings.reducedMotion = e.target.checked; };

  frame();
  /* 默认演一条金系的；?sp=法术键 可指定，方便单独验收某一条 */
  const want = (new URLSearchParams(location.search)).get('sp');
  const pick = want ? buttons.find(b => b.dataset.key === want) : buttons[0];
  if (pick) pick.click();
})();
</script>
</body>
</html>
